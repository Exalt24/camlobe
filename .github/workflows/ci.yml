name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: camlobe
          POSTGRES_PASSWORD: camlobe
          POSTGRES_DB: camlobe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U camlobe -d camlobe"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      search:
        image: getmeili/meilisearch:v1.12.8
        env:
          MEILI_MASTER_KEY: camlobe-local-master-key
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
    env:
      CAMLOBE_DB_HOST: localhost
      CAMLOBE_DB_PORT: "5432"
      CAMLOBE_MEILI_URL: http://localhost:7700
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Django system check and migrations match the models
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Every mutation guard still finds its text
        run: python tools/mutation_check.py --check-targets
      - name: Tests
        run: python -m pytest tests/ -q
